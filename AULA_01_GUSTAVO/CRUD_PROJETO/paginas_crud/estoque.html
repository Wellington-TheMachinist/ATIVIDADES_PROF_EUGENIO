

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ESTOQUE</title>
    <link rel="stylesheet" href="../estilo/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
</head>
<body>
    <div class="container">
        <h2 class="h2">GERENCIAMENTO DE ESTOQUE</h2>
        <div class="caixa-input">
            <input type="number" id="estoque_id" placeholder="ID (para alteração)" class="caixa-texto-id"><br>
            
            <label>Componente:</label>
            <select id="estoque_id_componente" class="caixa-texto"></select><br>
            
            <label>Depósito:</label>
            <select id="estoque_id_deposito" class="caixa-texto"></select><br>
            
            <input type="number" id="estoque_quant_comp" placeholder="Quantidade" class="caixa-texto">
        </div>
        
        <div class="caixa-botao">
            <input type="button" value="SALVAR" id="estoque_btnEnviar" class="botao">
            <input type="button" value="LISTAR" id="estoque_btnConsultar" class="botao">
            <input type="button" value="ALTERAR" id="estoque_btnAlterar" class="botao">
        </div>

        <div class="caixa-input">
            <p id="estoque_lista" class="amostragem"></p>
        </div>
        <a class="a" href="../pagina_principal/index.html">VOLTAR</a>
    </div>
    <script src="../backend/estoque.js"></script>
</body>
</html>
